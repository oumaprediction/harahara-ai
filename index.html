b{font-weight:700}.muted{color:var(--muted);font-size:12px}

.top{position:sticky;top:0;z-index:5;background:var(--paper)}

.mast .in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}

.date .d small{font-family:"Noto Sans JP",sans-serif;font-size:12px;font-weight:700;margin-left:4px}

.navs{max-width:960px;margin:0 auto;padding:0 16px;border-bottom:1px solid var(--line2);background:var(--paper)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar,.nos::-webkit-scrollbar{display:none}

.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}.tabs button.pick{color:var(--red)}
.tabs button.pick.on{border-bottom-color:var(--red)}
.nos{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:9px 0 10px}
.nos button{position:relative;flex:0 0 auto;width:50px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);

.nos button b{display:block;font-family:var(--num);font-size:17px;font-weight:600}

.rh h2{font-size:22px;font-weight:900;margin:1px 0 0;line-height:1.25}.meta{margin:2px 0 0;font-size:12px;color:var(--muted)}
.grade{display:inline-block;font-size:11px;font-weight:900;background:var(--ink);color:var(--panel);border-radius:3px;

.stamp{flex:0 0 auto;width:62px;height:62px;border-radius:50%;border:2.5px solid currentColor;display:flex;flex-direction:column;

.gS{color:var(--red)}.gA{color:var(--amber)}.gB{color:var(--ink2)}.gC{color:var(--muted);opacity:.7}
/* ===== 買いの狙い ===== */

padding:12px 14px 10px;margin-bottom:14px}
.bh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.bh h3{margin:0;font-size:16px;font-weight:900}
.bh .upd{font-size:12px;color:var(--muted)}.bh .facts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.fact{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:1px 8px;color:var(--ink2)}.fact b{color:var(--ink)}
.tix{margin:10px 0 4px}
.tx{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line2)}
.tx:first-child{border-top:0}

.score{font-size:12px;font-weight:700;color:var(--ink2);margin-left:auto}

.legend .shobu::before{background:var(--red)}.legend .hit::before{background:var(--navy)}.legend .ana::before{background:var(--amber)}

.card h3{font-size:14px;font-weight:900;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3::before{content:"";width:4px;height:14px;background:var(--red);border-radius:1px}
.card p{margin:4px 0}.pill{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:0 8px;font-weight:700;color:var(--muted)}
.axis{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.axis:first-of-type{border-top:0}.lb{font-weight:900;font-size:14px;line-height:1.1}.lb small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.marks{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.mi{display:inline-flex;align-items:center;gap:3px;font-size:19px}.mi b{font-size:20px;font-weight:700;line-height:1}
.mi .u{font-size:13px;min-width:22px;height:22px}.aim .mi{font-size:14px}

.chipt.shobu{background:var(--red)}.chipt.hit{background:var(--navy)}.chipt.ana{background:var(--amber)}
.sum{font-size:13px;color:var(--ink2);margin-top:8px!important}
.grp{display:inline-flex;align-items:center;gap:3px;margin:3px 12px 3px 0}.grp b{font-size:11px;color:var(--muted);margin-right:2px}

.sub small{font-size:11px;color:var(--muted);font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line);
text-align:left;white-space:nowrap}th{color:var(--muted);font-weight:500;font-size:11px}tr:last-child td{border-bottom:0}
.num{text-align:right;font-family:var(--num);font-size:14px}.combo{font-size:15px;white-space:normal;line-height:1.7}.tk td{vertical-align:top}
.scroll{overflow-x:auto}.hot{color:var(--good);font-weight:700}
.fc{display:inline-block;margin-right:8px}.fc small{display:block;font-size:10px;color:var(--muted);line-height:1}
.tkev{font-size:12px;color:var(--muted)}.warn{color:var(--red);font-weight:700}
/* ===== 出走馬 ===== */
.horses{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.horse{border-top:1px solid var(--line)}.horse:first-child{border-top:0}
.horse summary{display:grid;grid-template-columns:30px 34px 1fr 92px;gap:10px;align-items:center;padding:10px 12px;
cursor:pointer;list-style:none}.horse summary::-webkit-details-marker{display:none}
.horse[open]{background:color-mix(in srgb,var(--chip) 45%,var(--panel))}.horse summary:hover{background:color-mix(in srgb,var(--chip) 35%,transparent)}
.uma{font:600 16px/30px var(--num);text-align:center;border-radius:4px;width:30px;height:30px;border:1px solid transparent}
.mk{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}.mk b{font-size:22px;font-weight:700;min-height:22px}
.tag{font-style:normal}
.m0{color:var(--red)}.m1{color:var(--navy)}.m2{color:var(--good)}.m3,.m4{color:var(--ink2)}
.name{min-width:0}.nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.nm b{font-size:16px;font-weight:900}

.res{font:600 11px/1.6 var(--num);background:var(--ink);color:var(--panel);border-radius:3px;padding:0 5px;white-space:nowrap}
.evh{color:var(--ink2)!important}.evh .o{font-family:var(--num);font-size:14px;font-weight:600;color:var(--ink)}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.ai{text-align:right;line-height:1.1}.ai small{display:block;color:var(--muted);font-size:10px}
.ai b{font-family:var(--num);font-size:24px;font-weight:600}.ai b em{font-style:normal;font-size:12px;margin-left:1px}
.bar{display:block;height:4px;background:var(--bar);border-radius:2px;margin:4px 0 3px}.bar i{display:block;height:100%;background:var(--ink);border-radius:2px}
.marked .bar i{background:var(--red)}
.name small.sire{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.horse summary{grid-template-columns:26px 28px 1fr 52px;gap:8px;padding:10px}.nm b{font-size:15px}.ai .p3{display:none}
.ai b{font-size:20px}.rno{font-size:44px}.rh h2{font-size:19px}.stamp{width:54px;height:54px}.stamp b{font-size:26px}
.tx{grid-template-columns:52px 1fr auto;gap:8px}.tb .bet{font-size:15px}.tv b{font-size:19px}}
.body{padding:2px 12px 14px 12px}
.params{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:4px 0 12px}@media (max-width:480px){.params{grid-template-columns:1fr}}
.pr{display:grid;grid-template-columns:64px 1fr 26px 30px;gap:6px;align-items:center;font-size:12px}
.pb{height:6px;background:var(--bar);border-radius:3px;overflow:hidden}.pb i{display:block;height:100%;background:var(--navy);border-radius:3px}

.kv span{display:block;font-size:10px;color:var(--muted)}
.com{margin:6px 0;padding-left:18px;font-size:13px}
.w0{background:var(--chip)}.w1{background:#fff;color:#111;border-color:#bbb}.w2{background:#1d1d1d;color:#fff}.w3{background:#d8322a;color:#fff}
.w4{background:#2a5bd7;color:#fff}.w5{background:#f2cf1d;color:#111}.w6{background:#1f9a4b;color:#fff}.w7{background:#f08a24;color:#fff}
.w8{background:#f39cc2;color:#111}
/* ===== 今日の狙い ===== */
.today h2{font-size:24px;font-weight:900;margin:4px 0 2px}.today .lead{color:var(--muted);font-size:13px;margin:0 0 16px}
.tsec{margin:0 0 20px}.tsec h3{font-size:16px;font-weight:900;margin:0;display:flex;gap:8px;align-items:center}
.tsec h3 .cnt{font:600 13px/20px var(--num);min-width:20px;height:20px;text-align:center;border-radius:10px;color:var(--on);padding:0 6px}
.tsec .desc{font-size:12px;color:var(--muted);margin:2px 0 8px}
.tlist{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}

.empty{background:var(--panel);border:1px dashed var(--line2);border-radius:10px;padding:14px;color:var(--muted);font-size:13px}
